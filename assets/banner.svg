<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.7}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:20px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:13px;fill:#a5f3fc}.node{animation:pulse 3s infinite alternate ease-in-out}.flow-line{stroke-dasharray:8 8;animation:dash 20s linear infinite}.node-1{animation-delay:0s}.node-2{animation-delay:.7s}.node-3{animation-delay:1.4s}</style><rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/><g opacity=".35"><path fill="none" stroke="url(#accent-grad)" stroke-width="3" d="M 100,240 C 250,240 250,100 400,100 C 550,100 550,220 700,220 C 850,220 850,120 1050,120" class="flow-line"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 150,80 C 300,80 350,260 550,260 C 750,260 800,100 1100,250" class="flow-line"/><circle cx="100" cy="240" r="8" fill="#38bdf8" class="node node-1"/><circle cx="400" cy="100" r="10" fill="#818cf8" class="node node-2"/><circle cx="700" cy="220" r="9" fill="#c084fc" class="node node-3"/><circle cx="1050" cy="120" r="11" fill="#f472b6" class="node node-1"/><circle cx="150" cy="80" r="7" fill="#34d399" class="node node-2"/><circle cx="550" cy="260" r="10" fill="#fbbf24" class="node node-3"/><circle cx="1100" cy="250" r="8" fill="#f87171" class="node node-1"/></g><rect width="1200" height="6" x="0" y="0" fill="url(#accent-grad)"/><g transform="translate(80, 55)"><rect width="210" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><circle cx="20" cy="16" r="5" fill="#22c55e"/><text x="34" y="21" class="badge-text">OCTOBER 2026 EDITION</text></g><g><text x="0" y="0" class="title" transform="translate(80, 135)">Awesome Data Lineage Platforms 🔗</text><text x="0" y="42" class="subtitle" transform="translate(80, 135)">Curated Guide to Enterprise SaaS &amp; Open-Source Lineage Systems</text><text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" transform="translate(80, 135)">Column-Level Lineage • Impact Analysis • OpenLineage • Pipeline Tracing • Active Metadata</text></g><g filter="url(#glow)" transform="translate(980, 100)"><rect width="130" height="130" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="2" rx="24"/><path fill="none" stroke="#38bdf8" stroke-linejoin="round" stroke-width="3" d="M 35,40 L 65,40 L 95,90 L 65,90 Z"/><circle cx="35" cy="40" r="7" fill="#6366f1"/><circle cx="95" cy="40" r="7" fill="#a855f7"/><circle cx="35" cy="90" r="7" fill="#38bdf8"/><circle cx="95" cy="90" r="7" fill="#ec4899"/><path stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="2" d="M 35,40 L 95,40 M 35,90 L 95,90 M 35,40 L 35,90 M 95,40 L 95,90"/></g></svg>