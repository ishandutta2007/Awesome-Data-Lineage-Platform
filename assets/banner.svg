<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #a5f3fc;
    }
    .node {
      animation: pulse 3s infinite alternate ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    .node-1 { animation-delay: 0s; }
    .node-2 { animation-delay: 0.7s; }
    .node-3 { animation-delay: 1.4s; }

    @keyframes dash {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic / Animated Lineage Graph (Background Layer) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 100,240 C 250,240 250,100 400,100 C 550,100 550,220 700,220 C 850,220 850,120 1050,120" stroke="url(#accent-grad)" stroke-width="3" fill="none"/>
    <path class="flow-line" d="M 150,80 C 300,80 350,260 550,260 C 750,260 800,100 1100,250" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <!-- Nodes -->
    <circle cx="100" cy="240" r="8" fill="#38bdf8" class="node node-1"/>
    <circle cx="400" cy="100" r="10" fill="#818cf8" class="node node-2"/>
    <circle cx="700" cy="220" r="9" fill="#c084fc" class="node node-3"/>
    <circle cx="1050" cy="120" r="11" fill="#f472b6" class="node node-1"/>

    <circle cx="150" cy="80" r="7" fill="#34d399" class="node node-2"/>
    <circle cx="550" cy="260" r="10" fill="#fbbf24" class="node node-3"/>
    <circle cx="1100" cy="250" r="8" fill="#f87171" class="node node-1"/>
  </g>

  <!-- Decorative Top Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-grad)"/>

  <!-- Pill Badge -->
  <g transform="translate(80, 55)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="5" fill="#22c55e"/>
    <text x="34" y="21" class="badge-text">OCTOBER 2026 EDITION</text>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed clear & unobscured) -->
  <g transform="translate(80, 135)">
    <text x="0" y="0" class="title">Awesome Data Lineage Platforms 🔗</text>
    <text x="0" y="42" class="subtitle">Curated Guide to Enterprise SaaS &amp; Open-Source Lineage Systems</text>
    <text x="0" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
      Column-Level Lineage • Impact Analysis • OpenLineage • Pipeline Tracing • Active Metadata
    </text>
  </g>

  <!-- Right Side Visual Icon Element -->
  <g transform="translate(980, 100)" filter="url(#glow)">
    <rect width="130" height="130" rx="24" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="2"/>
    <!-- Lineage Icon -->
    <path d="M 35,40 L 65,40 L 95,90 L 65,90 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="35" cy="40" r="7" fill="#6366f1"/>
    <circle cx="95" cy="40" r="7" fill="#a855f7"/>
    <circle cx="35" cy="90" r="7" fill="#38bdf8"/>
    <circle cx="95" cy="90" r="7" fill="#ec4899"/>
    <path d="M 35,40 L 95,40 M 35,90 L 95,90 M 35,40 L 35,90 M 95,40 L 95,90" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

</svg>
